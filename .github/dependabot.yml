version: 2

# One weekly version-update PR across npm and GitHub Actions.
# Major upgrades require an explicit maintenance decision.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
